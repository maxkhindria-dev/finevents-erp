name: CI

# Runs on every pull request and on main. Branch protection should require
# all jobs below to pass before a pull request can be merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — style, static analysis, tests, audit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: finevents_test
          MYSQL_ROOT_PASSWORD: ci-only-not-a-secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-not-a-secret"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, redis, sodium
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Build front-end assets (needed by page tests)
        run: |
          npm ci
          npm run build

      - name: Tests (Pest) against MySQL 8, in random order
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: finevents_test
          DB_USERNAME: root
          DB_PASSWORD: ci-only-not-a-secret
        run: vendor/bin/pest --order-by=random

      # Permission layer 3: create the real logins the way production has them,
      # apply the permissions, and prove MySQL itself refuses what it should.
      - name: Database permission tests (layer 3) with real MySQL logins
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: finevents_test
          DB_USERNAME: fe_app
          DB_PASSWORD: ci-app-only
          DB_SENSITIVE_USERNAME: fe_sensitive
          DB_SENSITIVE_PASSWORD: ci-sensitive-only
          DB_MIGRATOR_USERNAME: fe_migrator
          DB_MIGRATOR_PASSWORD: ci-migrator-only
          FINEVENTS_PRIVILEGE_TESTS: '1'
        run: |
          mysql -h 127.0.0.1 -uroot -pci-only-not-a-secret -e "
            SET GLOBAL log_bin_trust_function_creators = 1;
            CREATE USER 'fe_app'@'%' IDENTIFIED BY 'ci-app-only';
            CREATE USER 'fe_sensitive'@'%' IDENTIFIED BY 'ci-sensitive-only';
            CREATE USER 'fe_migrator'@'%' IDENTIFIED BY 'ci-migrator-only';
            GRANT ALL PRIVILEGES ON finevents_test.* TO 'fe_migrator'@'%' WITH GRANT OPTION;
            GRANT CREATE USER ON *.* TO 'fe_migrator'@'%';"
          php artisan migrate:fresh --database=mysql_migrator --force
          php artisan finevents:db:privileges --apply
          vendor/bin/pest tests/Database

      - name: Known vulnerabilities in PHP packages
        run: composer audit

  frontend:
    name: Front end — build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Known vulnerabilities in JavaScript packages
        run: npm audit --audit-level=high
